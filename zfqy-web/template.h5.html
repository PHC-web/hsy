<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<title>
			<%= htmlWebpackPlugin.options.title %>
		</title>
		<!-- 浏览器标签图标：与 static/logo.png 同源；部署在 /admin/ 时为 /admin/static/logo.png -->
		<link rel="icon" type="image/png" href="<%= BASE_URL %>static/logo.png" />
		<link rel="apple-touch-icon" href="<%= BASE_URL %>static/logo.png" />
		<script>
			// 根路径为公众号 H5，须在 Vue/uniIdRouter 启动前写入 hash，避免先打开管理后台首页而跳转账号登录
			(function () {
				var pathname = window.location.pathname || '/';
				var isAdminPath = pathname === '/admin' || pathname.indexOf('/admin/') === 0;
				if (isAdminPath) return;
				var hash = window.location.hash || '';
				if (hash.indexOf('/pages/h5/') !== -1) return;
				var search = window.location.search || '';
				window.location.replace(pathname + search + '#/pages/h5/auth/index');
			})();
		</script>
		<script>
			var coverSupport = 'CSS' in window && typeof CSS.supports === 'function' && (CSS.supports('top: env(a)') || CSS.supports(
				'top: constant(a)'))
			document.write(
				'<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0' +
				(coverSupport ? ', viewport-fit=cover' : '') + '" />')
		</script>
		<link rel="stylesheet" href="<%= BASE_URL %>static/index.<%= VUE_APP_INDEX_CSS_HASH %>.css" />
	</head>

	<body>
		<noscript>
			<strong>Please enable JavaScript to continue.</strong>
		</noscript>
		<div id="app"></div>
		<!-- built files will be auto injected -->
	</body>

</html>
